name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Serialize rather than cancel: two concurrent runs would read the same version from
# gradle.properties and both try to release it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # shallow clones hide tags, and the already-released check needs them

      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Read the version
        id: version
        env:
          # A branch push re-releasing an already-tagged version is not an error — main
          # moves on every merge, most of which don't bump the version. A manual dispatch
          # doing the same means someone forgot to bump it, so that case should fail loud.
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # gradle.properties is the only place the version is set; F-Droid's checkupdates
          # reads the same lines at each tag. Refuse to re-release a version, so a
          # forgotten bump fails here instead of overwriting nothing and confusing later.
          VERSION=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Cannot parse VERSION_NAME: '$VERSION'" >&2; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            if [ "$EVENT_NAME" = push ]; then
              echo "::notice::v$VERSION is already released; nothing to do for this push."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "v$VERSION is already released. Bump VERSION_NAME and VERSION_CODE in gradle.properties first." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Verify required secrets
        if: steps.version.outputs.release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=()
          [ -z "$KEYSTORE_BASE64" ] && missing+=("KEYSTORE_BASE64")
          [ -z "$KEYSTORE_PASSWORD" ] && missing+=("KEYSTORE_PASSWORD")
          [ -z "$KEY_ALIAS" ] && missing+=("KEY_ALIAS")
          [ -z "$KEY_PASSWORD" ] && missing+=("KEY_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Decode keystore
        if: steps.version.outputs.release == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build signed release APK
        if: steps.version.outputs.release == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Copy APK to stable filename
        if: steps.version.outputs.release == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk Battleship.apk

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.version.outputs.release == 'true'
        with:
          name: Battleship-v${{ steps.version.outputs.version }}
          path: Battleship.apk

      # This step creates the tag as well as the release. Pushing the tag ourselves first
      # would mean a failure here left the tag behind with no release attached, and the
      # already-released check above would then refuse to retry that version.
      - name: Create GitHub Release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          # Without this the tag lands on whatever the default branch points at when the
          # API call runs, which is not necessarily the commit whose APK is attached.
          target_commitish: ${{ github.sha }}
          name: Battleship v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: Battleship.apk
